name: Weekly Lotto Data Auto Update

on:
  schedule:
    # 매주 토요일 21:30 KST (UTC 12:30) & 일요일 09:00 KST (UTC 00:00)
    - cron: '30 12 * * 6'
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run lotto update script
        run: python scripts/update_lotto_data.py

      - name: Commit and push if updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Lotto Auto Updater"
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update weekly lotto winning data" && git push)
